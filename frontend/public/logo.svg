<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5"/>
      <stop offset="100%" style="stop-color:#7C3AED"/>
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#A5B4FC"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect x="4" y="4" width="112" height="112" rx="28" fill="url(#bg)"/>
  <!-- Dashboard bars -->
  <rect x="24" y="62" width="14" height="30" rx="3" fill="url(#chart)" opacity="0.7"/>
  <rect x="44" y="46" width="14" height="46" rx="3" fill="url(#chart)" opacity="0.85"/>
  <rect x="64" y="30" width="14" height="62" rx="3" fill="#fff"/>
  <rect x="84" y="52" width="14" height="40" rx="3" fill="url(#chart)" opacity="0.6"/>
  <!-- Trend line -->
  <polyline points="31,58 51,42 71,26 91,48" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Dots on trend line -->
  <circle cx="31" cy="58" r="3.5" fill="#10B981"/>
  <circle cx="51" cy="42" r="3.5" fill="#10B981"/>
  <circle cx="71" cy="26" r="3.5" fill="#10B981"/>
  <circle cx="91" cy="48" r="3.5" fill="#10B981"/>
</svg>
